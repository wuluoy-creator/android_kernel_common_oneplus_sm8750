name: 一加SM8750(sun)内核云编译

run-name: >-
  ${{ github.event.inputs.kernel_branch == github.event.repository.default_branch && '主线编译' || '测试编译' }}
  - ${{ github.event.inputs.kernel_branch }}
  - ${{ github.event.inputs.ksu_type }}

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: '内核源码分支'
        required: true
        type: string
        default: '6.6-final'
      ksu_type:
        description: 'KernelSU分支(ReSukiSU/SukiSU Ultra/无内置KSU)'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'sukisu'
          - 'none'

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      DEFCONFIG: gki_defconfig
      DEVICE_NAME: OnePlus-SM8750-sun
      ZIP_NAME: OnePlus-SM8750-sun-Custom-Kernel.zip
      CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz
      AK3_REPO: https://github.com/wuluoy-creator/AnyKernel3.git
      SUSFS_BRANCH: gki-android15-6.6
      SUSFS_PATCH: 50_add_susfs_in_gki-android15-6.6.patch

    steps:
      - name: 1. 拉取内核源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_branch }}
          fetch-depth: 1

      - name: 2. 准备依赖与工具链
        id: prepare
        shell: bash
        run: |
          set -euxo pipefail

          SAFE_BRANCH="$(printf '%s' "${{ github.event.inputs.kernel_branch }}" | sed 's#[/\\:*?"<>|]#-#g')"
          echo "safe_branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses-dev libelf-dev libdw-dev \
            zip unzip curl wget rsync \
            python3 python-is-python3 cpio kmod \
            dwarves pahole \
            xz-utils zstd lz4 \
            device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

          rm -rf "$GITHUB_WORKSPACE/zyclang" zyclang.tar.gz
          wget -q "$CLANG_URL" -O zyclang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/zyclang"
          tar -xzf zyclang.tar.gz -C "$GITHUB_WORKSPACE/zyclang"
          rm -f zyclang.tar.gz

          CLANG_BIN="$GITHUB_WORKSPACE/zyclang/bin"
          if [[ ! -x "$CLANG_BIN/clang" ]]; then
            CLANG_PATH="$(find "$GITHUB_WORKSPACE/zyclang" -type f -name clang -perm -111 | head -n1)"
            if [[ -z "$CLANG_PATH" ]]; then
              echo "未找到 clang。"
              exit 1
            fi
            CLANG_BIN="$(dirname "$CLANG_PATH")"
          fi

          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

          echo "=== Clang 版本信息 ==="
          "$CLANG_BIN/clang" --version
          echo "=== LLD 版本信息 ==="
          "$CLANG_BIN/ld.lld" --version

          echo "=== 交叉编译工具检查 ==="
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

          pahole_version="$(pahole --version 2>/dev/null | head -n1 || true)"
          if [[ -n "$pahole_version" ]]; then
            echo "pahole版本：$pahole_version"
          else
            echo "pahole版本：未安装"
          fi

      - name: 3. 配置 KernelSU 与 SUSFS
        id: ksu_version
        shell: bash
        run: |
          set -euxo pipefail

          KSU_TYPE="${{ github.event.inputs.ksu_type }}"
          DEFCONFIG_PATH="$GITHUB_WORKSPACE/arch/arm64/configs/$DEFCONFIG"

          if [[ ! -f "$DEFCONFIG_PATH" ]]; then
            echo "未找到 defconfig：$DEFCONFIG_PATH"
            exit 1
          fi

          add_config() {
            local item="$1"
            grep -qxF "$item" "$DEFCONFIG_PATH" || echo "$item" >> "$DEFCONFIG_PATH"
          }

          add_susfs_config() {
            add_config "CONFIG_KSU_SUSFS=y"
            add_config "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            add_config "CONFIG_KSU_SUSFS_SUS_PATH=y"
            add_config "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            add_config "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            add_config "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            add_config "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            add_config "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            add_config "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            add_config "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            add_config "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            add_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            add_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            add_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            add_config "CONFIG_KSU_SUSFS_SUS_MAP=y"
          }

          apply_susfs_patch() {
            echo "正在应用 SUSFS 补丁..."
            cd "$GITHUB_WORKSPACE"

            rm -rf susfs4ksu SukiSU_patch
            git clone --depth 1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
            git clone --depth 1 https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch

            if [[ ! -f "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/$SUSFS_PATCH" ]]; then
              echo "未找到 SUSFS 主补丁：$SUSFS_PATCH"
              exit 1
            fi

            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/$SUSFS_PATCH" "$GITHUB_WORKSPACE/"
            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/"* "$GITHUB_WORKSPACE/fs/"
            cp "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/"* "$GITHUB_WORKSPACE/include/linux/"
            cp "$GITHUB_WORKSPACE/SukiSU_patch/69_hide_stuff.patch" "$GITHUB_WORKSPACE/"

            patch -p1 < "$SUSFS_PATCH"
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true

            # 修复部分源码与 hide_stuff/SUSFS 补丁组合后产生的非法声明：
            # extern static int ... -> static int ...
            if [[ -f "$GITHUB_WORKSPACE/security/selinux/hooks.c" ]]; then
              sed -i 's/\bextern static\b/static/g' "$GITHUB_WORKSPACE/security/selinux/hooks.c"
            fi

            add_susfs_config
          }

          echo "当前 KernelSU 模式：$KSU_TYPE"

          case "$KSU_TYPE" in
            sukisu)
              echo "正在配置 SukiSU Ultra..."
              curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s builtin

              if [[ ! -d "$GITHUB_WORKSPACE/KernelSU" ]]; then
                echo "SukiSU Ultra 安装后未找到 KernelSU 目录。"
                exit 1
              fi

              cd "$GITHUB_WORKSPACE/KernelSU"

              GIT_COMMIT_HASH="$(git rev-parse --short=8 HEAD)"
              echo "当前提交哈希：$GIT_COMMIT_HASH"

              KSU_API_VERSION=""
              for i in {1..3}; do
                KSU_API_VERSION="$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/Makefile" | \
                  grep -m1 "KSU_VERSION_API :=" | \
                  awk -F'= ' '{print $2}' | \
                  tr -d '[:space:]' || true)"
                [[ -n "$KSU_API_VERSION" ]] && break
                sleep 1
              done

              [[ -z "$KSU_API_VERSION" ]] && KSU_API_VERSION="3.1.7"
              echo "KSU_API_VERSION=$KSU_API_VERSION" >> "$GITHUB_ENV"

              VERSION_DEFINITIONS=$'define get_ksu_version_full\nv\\$1-'"$GIT_COMMIT_HASH"$'@sun\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"$'@sun'

              sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile
              sed -i '/KSU_VERSION_API :=/d' kernel/Makefile
              sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile

              awk -v def="$VERSION_DEFINITIONS" '
                /REPO_OWNER :=/ {print; print def; inserted=1; next}
                1
                END {if (!inserted) print def}
              ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile

              KSU_COUNT="$(git rev-list --count main 2>/dev/null || echo 0)"
              KSU_VERSION="$(expr "$KSU_COUNT" + 37185 2>/dev/null || echo 114514)"

              echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
              echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"

              grep -A10 "REPO_OWNER" kernel/Makefile || true
              grep "KSU_VERSION_FULL" kernel/Makefile || true
              echo "SukiSU Ultra版本号：v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@sun"

              cd "$GITHUB_WORKSPACE"

              apply_susfs_patch
              add_config "CONFIG_KSU=y"
              add_config "CONFIG_KPM=y"
              ;;

            resukisu)
              echo "正在配置 ReSukiSU..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main

              if [[ ! -d "$GITHUB_WORKSPACE/KernelSU" ]]; then
                echo "ReSukiSU 安装后未找到 KernelSU 目录。"
                exit 1
              fi

              apply_susfs_patch

              add_config 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%"'
              add_config "CONFIG_KSU=y"

              cd "$GITHUB_WORKSPACE/KernelSU"
              KSU_COUNT="$(git rev-list --count main 2>/dev/null || echo 0)"
              KSU_VERSION="$(expr "$KSU_COUNT" + 30700 2>/dev/null || echo 114514)"

              echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
              echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"

              cd "$GITHUB_WORKSPACE"
              ;;

            none)
              echo "已选择无内置 KernelSU，跳过 KernelSU 与 SUSFS 配置。"
              echo "ksuver=none" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "未知 ksu_type：$KSU_TYPE"
              exit 1
              ;;
          esac

          echo "=== defconfig 中的 KSU / KPM / SUSFS 相关配置 ==="
          grep -nE 'CONFIG_KSU|CONFIG_KPM' "$DEFCONFIG_PATH" || true

      - name: 4. 配置并编译内核
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_BIN:-$GITHUB_WORKSPACE/zyclang/bin}:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          MAKE_ARGS=(
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LTO=thin
            "KCFLAGS+=-O2"
          )

          AFDO_PROFILE="../android/gki/aarch64/afdo/kernel.afdo"
          if [[ -f "$AFDO_PROFILE" ]]; then
            MAKE_ARGS+=("CLANG_AUTOFDO_PROFILE=$AFDO_PROFILE")
          else
            echo "未找到 AFDO profile，跳过 CLANG_AUTOFDO_PROFILE。"
          fi

          make O=out mrproper
          make O=out "$DEFCONFIG" "${MAKE_ARGS[@]}"
          make O=out -j"$(nproc --all)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "=== 产物检查 ==="
          ls -lh out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: 5. 打包 AnyKernel3 卡刷包
        shell: bash
        run: |
          set -euxo pipefail

          test -f out/arch/arm64/boot/Image

          rm -rf AnyKernel3 "$ZIP_NAME"
          git clone --depth 1 "$AK3_REPO" AnyKernel3

          cp out/arch/arm64/boot/Image AnyKernel3/Image

          (
            cd AnyKernel3
            zip -r "../$ZIP_NAME" . -x ".git/*"
          )

          ls -lh "$ZIP_NAME"

      - name: 6. 上传编译产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_NAME }}-${{ steps.prepare.outputs.safe_branch }}-内核卡刷包
          path: |
            ${{ env.ZIP_NAME }}
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 90
