name: 一加SM8750(sun)内核云编译

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(默认ReSukiSU)'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'none'

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: 1. 拉取内核源码
        run: |
          sudo apt install -y libarchive-tools
          aria2c -s16 -x16 -k1M "https://github.com/wuluoy-creator/android_kernel_common_oneplus_sm8750/archive/refs/heads/6.6-final.zip" -o common.zip && \
          bsdtar -xf common.zip --strip-components=1 && \
          rm -f common.zip

      - name: 2. 安装系统编译依赖
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses-dev libelf-dev libdw-dev \
            zip unzip curl wget rsync \
            python3 cpio kmod \
            dwarves pahole \
            xz-utils zstd lz4 \
            device-tree-compiler \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: 3. 下载并配置 ZyClang 19 工具链
        run: |
          set -euxo pipefail
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz -O zyclang.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/zyclang"
          tar -xzf zyclang.tar.gz -C "$GITHUB_WORKSPACE/zyclang"

          echo "=== Clang 版本信息 ==="
          "$GITHUB_WORKSPACE/zyclang/bin/clang" --version
          echo "=== LLD 版本信息 ==="
          "$GITHUB_WORKSPACE/zyclang/bin/ld.lld" --version

          echo "$GITHUB_WORKSPACE/zyclang/bin" >> "$GITHUB_PATH"

      - name: 4. 验证相关工具
        run: |
          set -euxo pipefail
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

      - name: 5. 添加KernelSU
        run: |
          if [[ ${{ github.event.inputs.ksu_type }} == "resukisu" ]]; then
            echo "正在配置ReSukiSU..."
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
            git clone https://github.com/ShirkNeko/SukiSU_patch.git
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch $GITHUB_WORKSPACE
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* $GITHUB_WORKSPACE/fs/
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* $GITHUB_WORKSPACE/include/linux/
            cp $GITHUB_WORKSPACE/SukiSU_patch/69_hide_stuff.patch $GITHUB_WORKSPACE
            patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch
            patch -p1 -N -F 3 < 69_hide_stuff.patch
            
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%"' >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $GITHUB_WORKSPACE/arch/arm64/configs/gki_defconfig

            cd $GITHUB_WORKSPACE/KernelSU
            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      # 这里把 defconfig 改成你实际和别人一致的那个名字
      - name: 6. 配置并编译内核
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/zyclang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 建议替换成你真实使用的 defconfig（不要乱改）
          DEFCONFIG="gki_defconfig"

          make O=out mrproper
          make O=out "$DEFCONFIG" LLVM=1 LLVM_IAS=1 CC=clang LTO=thin CLANG_AUTOFDO_PROFILE="../android/gki/aarch64/afdo/kernel.afdo" KCFLAGS+=-O2
          make O=out -j"$(nproc --all)" LLVM=1 LLVM_IAS=1 CC=clang LTO=thin CLANG_AUTOFDO_PROFILE="../android/gki/aarch64/afdo/kernel.afdo" KCFLAGS+=-O2 2>&1 | tee build.log

          echo "=== 产物检查 ==="
          ls -lh out/arch/arm64/boot/Image
          file out/arch/arm64/boot/Image

      - name: 7. 打包AnyKernel3可刷入卡刷包（仅Image）
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/wuluoy-creator/AnyKernel3.git
          cd AnyKernel3

          # 只打包 Image（你已确认正常产物是 Image）
          cp ../out/arch/arm64/boot/Image .

          zip -r ../OnePlus-SM8750-sun-Custom-Kernel.zip . -x ".git/*"
          cd ..

      - name: 8. 上传编译产物与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8750-sun-内核卡刷包
          path: |
            OnePlus-SM8750-sun-Custom-Kernel.zip
            build.log
            out/.config
          retention-days: 90
